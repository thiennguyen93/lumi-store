# The reviewed list. One entry per extension; merging a change to this
# file (or to a submodule pin) is what publishes.
#
# [[extension]]
# id = "dev.you.thing"       # must equal the id in the manifest.toml
# path = "ext/dev.you.thing" # submodule directory, pinned to the reviewed commit
# subdir = "."               # where Cargo.toml + manifest.toml live inside it
# web = "web"                # optional: a front end built by the store — a pnpm
#                            # project (package.json with "packageManager": "pnpm@…",
#                            # pnpm-lock.yaml, a build script writing dist/) whose
#                            # output ships as ui/. ui/ itself is then not committed.
# category = "Productivity"  # the store's shelf for it, one of Productivity,
#                            # Writing, Windows, Design, Developer, Utilities —
#                            # decided in review, not by the author
# featured = true            # optional: among the plates turning over at the
#                            # top of Discover, in this file's order
# private = true             # first-party only: closed source, fetched with a
#                            # deploy key (README, "First-party private entries")

# First-party and in-tree — a third-party entry is a pinned submodule
# instead; ext/dev.thiennguyen.sample/README.md carries the distinction.
[[extension]]
id = "dev.thiennguyen.sample"
path = "ext/dev.thiennguyen.sample"
subdir = "sample"
category = "Developer"


# First-party and in-tree, for the sample's reason.
[[extension]]
id = "dev.thiennguyen.keytest"
path = "ext/dev.thiennguyen.keytest"
subdir = "."
category = "Utilities"


# First-party and closed source: a private repo, `update = none` in
# .gitmodules and fetched with a read-only deploy key by
# scripts/fetch-private.sh. Its React editor under web/ is built by the store.
[[extension]]
id = "dev.thiennguyen.screenshot"
path = "ext/dev.thiennguyen.screenshot"
subdir = "."
web = "web"
category = "Utilities"
featured = true
private = true


# First-party and in-tree, for the sample's reason. Its panel is React +
# TypeScript under web/, built by the store (`web`), so no ui/ is committed.
[[extension]]
id = "dev.thiennguyen.clipboard"
path = "ext/dev.thiennguyen.clipboard"
subdir = "."
web = "web"
category = "Productivity"
featured = true


# First-party and closed source, Screenshot's arrangement: a private repo,
# `update = none` in .gitmodules, fetched with a read-only deploy key of its
# own (STICKY_DEPLOY_KEY) by scripts/fetch-private.sh. Its React front end
# under web/ is built by the store. Needs Lumi 1.40.0 (`remember-frame`,
# `overhang`, `copies`, and `POST /__lumi__/download` behind `network`).
[[extension]]
id = "dev.thiennguyen.sticky"
path = "ext/dev.thiennguyen.sticky"
subdir = "."
web = "web"
category = "Productivity"
private = true
