# Build every listed extension from its reviewed source, sign, publish.
#
# Merging to main is publishing — this runs on every push and rebuilds the
# whole store, because the store is small and "rebuild everything" has no
# stale-diff edge cases. Everything is rebuilt from pinned submodules, so
# what ships is what was reviewed. A version the store already serves is
# not packed again: its package and signature go out as they first did
# (`publish.py` `carried`), because the wasm a runner builds depends on the
# runner's Rust, and a new package under an old URL is a cache's mismatch.
#
# **The build and the signature are different jobs, and that is the whole
# design of this file.** `cargo build` runs a submission's `build.rs` and
# proc macros, and those of every crate it depends on from crates.io — code
# nobody here reviewed, in the job it runs in. This file used to build and
# sign in one job. The key was written to `$RUNNER_TEMP` on the reasoning
# that a build script reads the checkout, but a build script runs as the
# runner's own user and can read any file the job can, and the path was in
# the environment for it. The job's token could write `contents` too, and
# `actions/checkout` leaves it in `.git/config`. One malicious or compromised
# transitive crate was the store key — after which the signature every copy
# of Lumi treats as the wall means nothing until an app release rotates it.
#
# So:
#
#   plan   reads the reviewed list. No submodules, nothing built.
#   build  one runner per extension. No secret (a private entry's leg
#          holds its deploy key for one step; see below), a read-only token that is
#          not persisted, and the only things it hands on are what it
#          compiled: extension.wasm, and ui/ for an entry whose front end is
#          built from web/ (`pnpm install --frozen-lockfile --ignore-scripts`
#          then its build script — the npm half of the same threat as a
#          build.rs, and the reason it runs here and nowhere near the key).
#          One extension's build cannot touch another's output, because it
#          is on another machine.
#   sign   runs no cargo, no pnpm and nothing from any submission. It takes
#          the compiled output and nothing else from each build, packs the
#          manifest and icon (and a hand-written ui/) from the reviewed
#          source itself — a build could have rewritten those on its own
#          runner — signs, indexes, and pushes gh-pages.
#          `publish.py --sign-built` is that step, and says why at length.
#   discussions
#          beside the others: one GitHub Discussion per extension, for
#          hearts and feedback. `discussions: write`, and the private
#          entries' manifests to title their threads by.
#
# **Private entries** (`private = true` in extensions.toml) are the store
# owner's closed-source extensions: private repos, pinned as submodules
# marked `update = none`, so every recursive checkout here skips them.
# `scripts/fetch-private.sh` checks each out with a read-only deploy key of
# its own (`<NAME>_DEPLOY_KEY`, the id's last part), which opens that one
# repository and nothing else, in three places only: the entry's own build
# leg — handed only its own key, before `publish.py --build`, with the key
# deleted by the time any build script runs — the sign job, which packs
# their manifests and icons, and the discussions job, which reads their
# names for the threads; the last two run no submission's code. Their
# source never crosses between jobs as an artifact: artifacts of a public
# repository can be downloaded by anyone. What they compile is published
# like every other package.
#
# What this does not close: an extension's own build can still put whatever
# it likes in its *own* wasm. That is the author's code by definition, and
# the review of its source and its dependencies is the wall for it.
#
# Every `uses:` is pinned to a commit SHA, the Lumi repo's own rule: a tag
# is a branch somebody can force-push, and the sign job holds the key. The
# only actions are GitHub's own checkout and artifact actions; everything
# else is the runner's toolchain, on purpose.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      entries: ${{ steps.list.outputs.entries }}
      private: ${{ steps.list.outputs.private }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: list
        run: python3 scripts/publish.py --list >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.entries) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      # Only in a private entry's own leg, and before the build: the key
      # is on disk for this step alone.
      # Each key only in its own entry's leg: a leg is handed the one
      # secret that opens its repository, and an empty string for the rest.
      - name: Private source
        if: contains(fromJSON(needs.plan.outputs.private), matrix.id)
        env:
          ID: ${{ matrix.id }}
          SCREENSHOT_DEPLOY_KEY: ${{ matrix.id == 'dev.thiennguyen.screenshot' && secrets.SCREENSHOT_DEPLOY_KEY || '' }}
          STICKY_DEPLOY_KEY: ${{ matrix.id == 'dev.thiennguyen.sticky' && secrets.STICKY_DEPLOY_KEY || '' }}
        run: scripts/fetch-private.sh "$ID"

      # No minisign and no secret: nothing here signs. Node is the
      # runner's own; pnpm is whatever version the entry's package.json
      # pins, fetched by corepack, so no third-party setup action is
      # needed for it (see the header on pins).
      - name: Toolchain
        run: |
          rustup target add wasm32-wasip2
          corepack enable

      # Through the environment rather than `${{ }}` in the script: an
      # expression is pasted into the shell before it runs. The id is
      # already held to Lumi's alphabet by `--list`; this is the habit that
      # does not depend on that.
      - name: Validate and build
        env:
          ID: ${{ matrix.id }}
        run: python3 scripts/publish.py --build "$ID" "$RUNNER_TEMP/out"

      # The whole output directory: extension.wasm, and ui/ for a web
      # entry. `--sign-built` decides per entry which of it to take.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-${{ matrix.id }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 1

  # One GitHub Discussion per extension, the thread Lumi reads hearts from
  # (`scripts/discussions.py` says how). Its own job because it is the
  # only one that needs `discussions: write`: no build, and the manifests
  # are read as files — the private entries' too, fetched with the deploy
  # key as the sign job fetches them. `continue-on-error` because a like
  # button is not worth holding a release for — when this fails, the
  # index carries `discussion: null` for every extension and Lumi hides
  # the hearts until the next run, which is why a private source that
  # cannot be fetched only leaves that one entry's thread as it is.
  discussions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      discussions: write
    outputs:
      discussions: ${{ steps.sync.outputs.discussions }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      # The private entries' manifests, for their threads' titles. Nothing
      # from them runs here, and the key is gone before the next step.
      - name: Private sources
        env:
          SCREENSHOT_DEPLOY_KEY: ${{ secrets.SCREENSHOT_DEPLOY_KEY }}
          STICKY_DEPLOY_KEY: ${{ secrets.STICKY_DEPLOY_KEY }}
        run: scripts/fetch-private.sh
      - id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/discussions.py >> "$GITHUB_OUTPUT"

  sign:
    needs: [plan, build, discussions]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Submodules for their files — the manifests, icons and ui/ this job
      # packs — and nothing here runs them: no cargo, no build script, no
      # submission's code. Credentials not persisted, so nothing that reads
      # the checkout finds a token in it; the push below names its own.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      # The private entries' manifests, icons and store pages, packed
      # below. Nothing from them runs here.
      - name: Private sources
        env:
          SCREENSHOT_DEPLOY_KEY: ${{ secrets.SCREENSHOT_DEPLOY_KEY }}
          STICKY_DEPLOY_KEY: ${{ secrets.STICKY_DEPLOY_KEY }}
        run: scripts/fetch-private.sh

      # minisign from Ubuntu's archive. A mirror that stops answering held
      # this step — and the publish behind it — until GitHub's six-hour
      # limit (2026-10-07): now each try gives up after two minutes, apt
      # itself after half a minute without an answer, three tries, and the
      # step after ten.
      - name: Toolchain
        timeout-minutes: 10
        run: |
          apt_opts=(-q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          for try in 1 2 3; do
            if timeout 120 sudo apt-get "${apt_opts[@]}" update && timeout 120 sudo apt-get "${apt_opts[@]}" install -y minisign; then
              exit 0
            fi
            echo "apt did not finish (try $try of 3)"
            sleep 15
          done
          exit 1

      # One directory per build, `wasm-<id>/extension.wasm` (and
      # `wasm-<id>/ui/`), which is the shape `--sign-built` reads. The id comes from the reviewed list,
      # never from what an artifact is called.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wasm-*
          path: ${{ runner.temp }}/built
          merge-multiple: false

      # download-artifact flattens straight into `path` — skipping the
      # `wasm-<id>/` subdir the comment above promises — whenever exactly
      # one artifact matches the pattern, whatever `merge-multiple` says:
      # https://github.com/actions/download-artifact/blob/v8.0.1/src/download-artifact.ts#L185-L194
      # (`isSingleArtifactDownload || mergeMultiple || artifacts.length === 1`).
      # The store has one extension today, so this branch is not
      # hypothetical; it fired on 2026-09-27 and `--sign-built` failed with
      # "the build handed over no extension.wasm". Restore the shape
      # `--sign-built` reads before it runs.
      - name: Restore per-build directory when only one artifact downloaded
        env:
          ENTRIES: ${{ needs.plan.outputs.entries }}
        run: |
          python3 - <<'PY'
          import json, os, shutil

          entries = json.loads(os.environ["ENTRIES"])
          built = os.path.join(os.environ["RUNNER_TEMP"], "built")
          flattened = os.path.join(built, "extension.wasm")

          # Everything flattened moves, ui/ included — a web entry's
          # artifact is a directory, not one file.
          if len(entries) == 1 and os.path.isfile(flattened):
              only = entries[0]
              dest_dir = os.path.join(built, f"wasm-{only}")
              os.makedirs(dest_dir, exist_ok=True)
              for name in os.listdir(built):
                  if name != f"wasm-{only}":
                      shutil.move(os.path.join(built, name), os.path.join(dest_dir, name))
          PY

      # What the store serves now: the gh-pages branch, as the last run
      # pushed it. `publish.py` carries a version it already serves rather
      # than packing and signing it again, and holds that version to the
      # source it was published from (`carried`). Fetched from the public
      # branch, so no token; a branch that is not there yet is the first
      # publish, and anything else stops the run.
      - name: Published packages
        run: |
          mkdir -p "$RUNNER_TEMP/published"
          set +e
          git ls-remote --exit-code --heads origin gh-pages > /dev/null
          found=$?
          set -e
          case "$found" in
            0)
              git fetch -q --depth 1 origin gh-pages
              git archive FETCH_HEAD extensions | tar -x -C "$RUNNER_TEMP/published"
              ;;
            2) echo "nothing published yet" ;;
            *) exit "$found" ;;
          esac

      - name: Pack, sign, index
        env:
          PUBLISHED_DIR: ${{ runner.temp }}/published/extensions
          # The Pages custom domain — the account serves *.github.io from
          # thiennguyen.dev, so this is the URL that answers without a
          # redirect, and the one compiled into Lumi's store client.
          BASE_URL: https://thiennguyen.dev/lumi-store/extensions
          STORE_SIGNING_KEY: ${{ secrets.STORE_SIGNING_KEY }}
          # `{id: {number, url}}`, or empty when that job failed.
          DISCUSSIONS: ${{ needs.discussions.outputs.discussions }}
        run: |
          if [ -n "$STORE_SIGNING_KEY" ]; then
            printf '%s\n' "$STORE_SIGNING_KEY" > "$RUNNER_TEMP/store.key"
            chmod 600 "$RUNNER_TEMP/store.key"
          fi
          STORE_KEY_FILE="$RUNNER_TEMP/store.key" \
            python3 scripts/publish.py --sign-built "$RUNNER_TEMP/built"

      # A plain push to gh-pages rather than a deploy action — see the
      # header. Force-pushed because the branch is an artifact, not
      # history: the source of truth is main plus the submodule pins.
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "lumi-store ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A
          git commit -qm "publish ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
