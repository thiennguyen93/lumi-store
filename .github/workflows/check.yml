# Check a pull request the way publish.yml will build it on merge —
# validate every manifest, build every extension from source, pack it —
# and stop before the signature. Nothing is signed, indexed or deployed.
#
# `pull_request`, never `pull_request_target`, and that is the design: a
# submission's own build script runs in this job (build.rs, proc macros),
# so this job must hold nothing worth stealing. On `pull_request` a fork's
# run gets no secrets and a read-only token; `pull_request_target` would
# hand it the base repository's secrets, STORE_SIGNING_KEY among them —
# the key every copy of Lumi trusts. The same reason keeps the token out of
# the checkout (`persist-credentials: false`) and the permissions at read.
#
# Secrets do reach this job on a pull request from this repository: the
# private entries' read-only deploy keys, one per entry, handed to the one
# step that fetches their source and gone from the disk before anything is
# built. A fork's run has no secrets, fetches nothing, and `--check`
# skips those entries and says so. publish.yml's header has the rest.
#
# Pinned to the commit SHA publish.yml pins, for publish.yml's reason.
name: check

on:
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Builds every entry, a few minutes; never GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      # The private entries' submodules are `update = none`, so the
      # checkout above left them empty.
      - name: Private sources
        env:
          SCREENSHOT_DEPLOY_KEY: ${{ secrets.SCREENSHOT_DEPLOY_KEY }}
          STICKY_DEPLOY_KEY: ${{ secrets.STICKY_DEPLOY_KEY }}
        run: scripts/fetch-private.sh

      # No minisign: nothing here signs. corepack for a web entry's pinned
      # pnpm, publish.yml's reason.
      - name: Toolchain
        run: |
          rustup target add wasm32-wasip2
          corepack enable

      - name: Store script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # What the store serves now: the gh-pages branch, as the last run
      # pushed it. `publish.py` carries a version it already serves rather
      # than packing and signing it again, and holds that version to the
      # source it was published from (`carried`). Fetched from the public
      # branch, so no token; a branch that is not there yet is the first
      # publish, and anything else stops the run.
      - name: Published packages
        run: |
          mkdir -p "$RUNNER_TEMP/published"
          set +e
          git ls-remote --exit-code --heads origin gh-pages > /dev/null
          found=$?
          set -e
          case "$found" in
            0)
              git fetch -q --depth 1 origin gh-pages
              git archive FETCH_HEAD extensions | tar -x -C "$RUNNER_TEMP/published"
              ;;
            2) echo "nothing published yet" ;;
            *) exit "$found" ;;
          esac

      - name: Validate, build, pack
        env:
          PUBLISHED_DIR: ${{ runner.temp }}/published/extensions
        run: python3 scripts/publish.py --check
