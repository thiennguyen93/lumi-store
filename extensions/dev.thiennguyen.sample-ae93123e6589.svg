<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Corners at 22.5% of the side, the macOS icon ratio Lumi clips every
       extension icon to: the menu bar menu and the store's web page draw this
       file unclipped, so it carries the same corner itself. The glyph is
       Lucide's "languages" (ISC), stroked on the 24-unit grid and scaled to
       30 of the 64 units, centred — the same weight as the marks Lumi draws
       beside it. The sheen is the top half only, so the tile reads as lit from
       above rather than as a second gradient. -->
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d6af0"/>
      <stop offset="1" stop-color="#5145cd"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14.4" fill="url(#fill)"/>
  <rect width="64" height="64" rx="14.4" fill="url(#sheen)"/>
  <g transform="translate(14 14) scale(1.5)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m5 8 6 6"/>
    <path d="m4 14 6-6 2-3"/>
    <path d="M2 5h12"/>
    <path d="M7 2h1"/>
    <path d="m22 22-5-10-5 10"/>
    <path d="M14 18h6"/>
  </g>
</svg>
