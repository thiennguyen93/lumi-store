    <rect x="29.5" y="32" width="5" height="5.5" rx="1.3"/>
    <rect x="36" y="32" width="5" height="5.5" rx="1.3"/>
    <rect x="42.5" y="32" width="5" height="5.5" rx="1.3"/>
    <rect x="49" y="32" width="5" height="5.5" rx="1.3"/>
    <rect x="10" y="39" width="8.25" height="5.5" rx="1.3"/>
    <rect x="19.75" y="39" width="5" height="5.5" rx="1.3"/>
    <rect x="26.25" y="39" width="5" height="5.5" rx="1.3"/>
