  <!-- Over it, a V folded like a ribbon: the left arm laid over the right. -->
  <g fill="none" stroke-width="8" stroke-linecap="round">
    <path d="M47 16.5l-15 31" stroke="#fecaca"/>
    <path d="M17 16.5l15 31" stroke="#ffffff"/>
