# Keyboard Cleaner's manifest. One tab of its own, a sheet it asks with before
# cleaning, a Settings tab Lumi draws for cleaning, and one capability:
# holding the keyboard while it is cleaned.
[extension]
id = "dev.thiennguyen.keytest"
name = "Keyboard Cleaner"
version = "0.6.0"
description = "Lock your MacBook keyboard while you wipe it, then check every key and catch keys that double-type."
author = "Thien Nguyen"
summary = "Opens a Keyboard tab here in Lumi. Clean keyboard locks every key on your Mac for a while — and the trackpad too, if you choose — so you can wipe it without typing into anything, and lights each key you wipe on a drawn MacBook keyboard, so cleaning tests it too. Any time, press each key and watch it light up: it counts the keys you have covered, shows which are held, and flags a key that registers twice from one press — the chatter a worn or dusty switch produces. Nothing leaves the page."
homepage = "https://lumikeys.app/docs/extensions"
# 1.38.0 for `input-hold`, the capability cleaning needs: an older Lumi
# does not know the word and would refuse the manifest for it. (WIT 0.3,
# [[page]] and the settings layout all came before it.)
min-lumi-version = "1.38.0"
# Cleaning: the page asks Lumi to hold every key on the Mac — and the
# trackpad, if the person turned that on in Settings — and to relay each held key to it, so
# the board lights as the keyboard is wiped (`/__lumi__/input-hold`). The
# review sheet says both halves: the keyboard stops reaching any app for a
# while, and the extension sees the keys pressed meanwhile.
capabilities = ["input-hold"]
# Pictures for this extension's page in Lumi's Extension Store: the
# keyboard locked part way through a clean, the board mid-test (a
# double-typed E, shift + K held) and the ISO layout in dark. The store
# publishes them beside the package; Lumi's installer ignores it.
screenshots = ["shots/1-clean.png", "shots/2-keyboard.png", "shots/3-iso-dark.png"]

[[page]]
name = "keytest"
label = "Keyboard"
path = "keytest.html"
# Keys are the whole page: take the keyboard when the tab opens, so the
# first keystroke is heard without a click first.
focus = true
# fn / Globe on its own is never sent to a page; Lumi hears it and relays it
# as a `lumi:fn` event. An older Lumi ignores the key, and the page falls
# back to what fn makes of delete and the arrows.
fn-key = true
# F11 is macOS's Show Desktop, which moves this window aside before the key
# reaches it. While the tab is in front, Lumi takes F1–F12 from the system
# and relays them as `lumi:key` events; media keys are left alone.
function-keys = true

# The question before every clean: a dialog over the whole of Lumi's
# window, in Lumi's own frame, opened by the tab's Clean keyboard button and
# answered back to it (`ui/confirm.html`). Sized to its content — the four
# ways out and the buttons; a shorter window scrolls it.
[[sheet]]
name = "confirm"
path = "confirm.html"
width = 420
height = 360
title = "Clean the keyboard"

# How long Clean keyboard locks the keys. Chosen here, in the Settings tab
# Lumi draws, so the page's Clean keyboard button only has to start.
[[settings]]
name = "clean-seconds"
label = "Lock for"
kind = "segmented"
default = "60"

[[settings.options]]
value = "30"
label = "30 s"

[[settings.options]]
value = "60"
label = "1 min"

[[settings.options]]
value = "120"
label = "2 min"

[[settings.options]]
value = "300"
label = "5 min"

# Whether Clean keyboard locks the trackpad too.
[[settings]]
name = "clean-pointer"
label = "Lock the trackpad too"
kind = "bool"
default = "false"

# The tab is for cleaning and nothing else. The board's layout is not a
# setting: it is switched on the page and kept in the extension's own
# storage (`src/lib.rs`), so it is not drawn here a second time.
[[settings.layout]]
section = "Clean keyboard"
rows = [["clean-seconds"], ["clean-pointer"]]
help.clean-seconds = "How long no key types anything, in any app."
help.clean-pointer = "Clicks, scrolling and swipes reach nothing, and the cursor stays still. Unlock with esc and right shift held for 2 seconds."
