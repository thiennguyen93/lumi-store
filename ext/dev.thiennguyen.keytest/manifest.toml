# Keyboard Test's manifest. One tab, three stored choices, and one
# capability: holding the keyboard while it is cleaned.
[extension]
id = "dev.thiennguyen.keytest"
name = "Keyboard Test"
version = "0.4.0"
description = "Check every key of a MacBook keyboard, catch keys that double-type, and lock it while you clean it."
author = "Thien Nguyen"
summary = "Opens a Keyboard test tab here in Lumi: press each key and watch it light up on a MacBook keyboard. It counts the keys you have covered, shows which are held, and flags a key that registers twice from one press — the chatter a worn or dusty switch produces. Clean keyboard locks every key for a while so you can wipe it, and lights each key you wipe, so cleaning tests it too. Nothing leaves the page."
homepage = "https://lumikeys.app/docs/extensions"
# 1.38.0 for `input-hold`, the capability cleaning needs: an older Lumi
# does not know the word and would refuse the manifest for it. (WIT 0.3,
# [[page]] and settings-tab all came before it.)
min-lumi-version = "1.38.0"
# The fields below are the page's memory, not settings anybody picks from
# a form: the page has its own switches for them.
settings-tab = false
# Cleaning: the page asks Lumi to hold every key on the Mac — and the
# trackpad, if the person ticks it — and to relay each held key to it, so
# the board lights as the keyboard is wiped (`/__lumi__/input-hold`). The
# review sheet says both halves: the keyboard stops reaching any app for a
# while, and the extension sees the keys pressed meanwhile.
capabilities = ["input-hold"]
# Pictures for this extension's page in Lumi's Extension Store: the board
# mid-test (a double-typed E, shift + K held) and the ISO layout in dark.
# The store publishes them beside the package; Lumi's installer ignores it.
screenshots = ["shots/1-keyboard.png", "shots/2-iso-dark.png"]

[[page]]
name = "keytest"
label = "Keyboard test"
path = "keytest.html"
# Keys are the whole page: take the keyboard when the tab opens, so the
# first keystroke is heard without a click first.
focus = true
# fn / Globe on its own is never sent to a page; Lumi hears it and relays it
# as a `lumi:fn` event. An older Lumi ignores the key, and the page falls
# back to what fn makes of delete and the arrows.
fn-key = true
# F11 is macOS's Show Desktop, which moves this window aside before the key
# reaches it. While the tab is in front, Lumi takes F1–F12 from the system
# and relays them as `lumi:key` events; media keys are left alone.
function-keys = true

# Which keyboard the page draws. Saved by the page through the bridge;
# declared because the bridge keeps declared fields only.
[[settings]]
name = "layout"
label = "Layout"
kind = "segmented"
default = "ansi"

[[settings.options]]
value = "ansi"
label = "ANSI (US)"

[[settings.options]]
value = "iso"
label = "ISO"

# How long cleaning lasts, in seconds, as last chosen on the page.
[[settings]]
name = "clean-seconds"
label = "Clean for"
kind = "segmented"
default = "60"

[[settings.options]]
value = "30"
label = "30 s"

[[settings.options]]
value = "60"
label = "1 min"

[[settings.options]]
value = "120"
label = "2 min"

[[settings.options]]
value = "300"
label = "5 min"

# Whether cleaning locks the trackpad too, as last chosen on the page.
[[settings]]
name = "clean-pointer"
label = "Lock the trackpad too"
kind = "bool"
default = "false"
