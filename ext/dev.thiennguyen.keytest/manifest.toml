# Keyboard Test's manifest. One tab, one stored choice, no capability.
[extension]
id = "dev.thiennguyen.keytest"
name = "Keyboard Test"
version = "0.3.1"
description = "Check every key of a MacBook keyboard, and catch keys that double-type."
author = "Thien Nguyen"
summary = "Opens a Keyboard test tab here in Lumi: press each key and watch it light up on a MacBook keyboard. It counts the keys you have covered, shows which are held, and flags a key that registers twice from one press — the chatter a worn or dusty switch produces. Nothing leaves the page."
homepage = "https://lumikeys.app/docs/extensions"
# 1.25.0 because this build is against WIT 0.3, which a Lumi speaking 0.2
# refuses outright. ([[page]] and settings-tab, which arrived in 1.23.0,
# came before it.)
min-lumi-version = "1.25.0"
# The layout below is the page's memory, not a setting anybody picks from
# a form: the page has its own switch for it.
settings-tab = false
capabilities = []
# Pictures for this extension's page in Lumi's Extension Store: the board
# mid-test (a double-typed E, shift + K held) and the ISO layout in dark.
# The store publishes them beside the package; Lumi's installer ignores it.
screenshots = ["shots/1-keyboard.png", "shots/2-iso-dark.png"]

[[page]]
name = "keytest"
label = "Keyboard test"
path = "keytest.html"
# Keys are the whole page: take the keyboard when the tab opens, so the
# first keystroke is heard without a click first.
focus = true
# fn / Globe on its own is never sent to a page; Lumi hears it and relays it
# as a `lumi:fn` event. An older Lumi ignores the key, and the page falls
# back to what fn makes of delete and the arrows.
fn-key = true
# F11 is macOS's Show Desktop, which moves this window aside before the key
# reaches it. While the tab is in front, Lumi takes F1–F12 from the system
# and relays them as `lumi:key` events; media keys are left alone.
function-keys = true

# Which keyboard the page draws. Saved by the page through the bridge;
# declared because the bridge keeps declared fields only.
[[settings]]
name = "layout"
label = "Layout"
kind = "segmented"
default = "ansi"

[[settings.options]]
value = "ansi"
label = "ANSI (US)"

[[settings.options]]
value = "iso"
label = "ISO"
