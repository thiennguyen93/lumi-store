# Vietnamese Typing's manifest: Telex and VNI in every app, typed through
# Lumi's text-input primitive. The engine is Gõ Nhanh's core (BSD-3-Clause,
# THIRD-PARTY-NOTICES.md); Lumi itself knows no language — every key of the
# word goes to this extension's sealed run, which answers how the word
# changes.
[extension]
id = "dev.thiennguyen.vietnamese"
name = "Vietnamese Typing"
version = "0.1.0"
description = "Type Vietnamese with Telex or VNI in every app, with no input method to install."
author = "Thien Nguyen"
summary = "Type Vietnamese in any app with Telex (tieengs → tiếng) or VNI (tie61ng → tiếng), switched on and off from Lumi's menu bar or a shortcut you choose, and remembered for each app. Built on the Gõ Nhanh engine. Every key you type passes through it to become Vietnamese, and nothing else: it holds no network access, keeps no keys, and Lumi lets it change only the word you are typing."
homepage = "https://lumikeys.app/docs/extensions"
# 1.61.0 for `text-input` and `front-app`: an older Lumi does not know
# either word and would refuse the manifest for it.
min-lumi-version = "1.61.0"
# `text-input`: every key of the word, answered in a sealed run. The review
# sheet says it loudest and adds a warning; Lumi refuses it beside
# `network` or `ai`, and this extension holds neither.
# `front-app`: which app is in front, so the switch is remembered per app.
# `menu`: one row in Lumi's menu bar menu showing whether typing is on.
capabilities = ["text-input", "front-app", "menu"]
events = ["text-input", "text-input-enabled", "front-app"]

[[command]]
name = "toggle"
label = "Switch Vietnamese typing on or off"
icon = "languages"

[[settings]]
name = "method"
label = "Typing method"
kind = "select"
default = "telex"

[[settings.options]]
value = "telex"
label = "Telex"

[[settings.options]]
value = "vni"
label = "VNI"

[[settings]]
name = "modernTone"
label = "Place tone marks the modern way (hoà, thuý)"
kind = "bool"
default = "true"

[[settings]]
name = "escRestore"
label = "Escape gives back the keys as typed"
kind = "bool"
default = "true"

[[settings]]
name = "englishRestore"
label = "Keep English words as typed"
kind = "bool"
default = "false"

[[settings]]
name = "perApp"
label = "Remember on or off for each app"
kind = "bool"
default = "true"
