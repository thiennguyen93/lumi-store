# Lumi Gõ tiếng Việt's manifest: Telex and VNI in every app, typed through
# Lumi's text-input primitive. The engine is Gõ Nhanh's core (BSD-3-Clause,
# THIRD-PARTY-NOTICES.md); Lumi itself knows no language — every key of the
# word goes to this extension's sealed run, which answers how the word
# changes.
[extension]
id = "dev.thiennguyen.vietnamese"
name = "Lumi Gõ tiếng Việt"
version = "0.1.1"
description = "Type Vietnamese with Telex or VNI in every app, with no input method to install."
author = "Thien Nguyen"
summary = "Type Vietnamese in any app with Telex (tieengs → tiếng) or VNI (tie61ng → tiếng), switched on and off from Lumi's menu bar or a shortcut you choose, and remembered for each app. Every key you type passes through it to become Vietnamese, and nothing else: it holds no network access, keeps no keys, and Lumi lets it change only the word you are typing."
homepage = "https://lumikeys.app/docs/extensions"
# 1.61.0 for `text-input` and `front-app`: an older Lumi does not know
# either word and would refuse the manifest for it.
min-lumi-version = "1.61.0"
# `text-input`: every key of the word, answered in a sealed run. The review
# sheet says it loudest and adds a warning; Lumi refuses it beside
# `network` or `ai`, and this extension holds neither.
# `front-app`: which app is in front, so the switch is remembered per app.
# `menu`: one row in Lumi's menu bar menu showing whether typing is on.
capabilities = ["text-input", "front-app", "menu"]
events = ["text-input", "text-input-enabled", "front-app"]

[[command]]
name = "toggle"
label = "Switch Vietnamese typing on or off"
icon = "languages"

# The language this extension's own pages are read in. Vietnamese first: it
# is who the extension is for. Lumi's own words around them — the tab names,
# the Permissions sheet — stay Lumi's.
[[settings]]
name = "language"
label = "Display language"
kind = "select"
default = "vi"

[[settings.options]]
value = "vi"
label = "Tiếng Việt"

[[settings.options]]
value = "en"
label = "English"

[[settings]]
name = "method"
label = "Typing method"
kind = "select"
default = "telex"

[[settings.options]]
value = "telex"
label = "Telex"

[[settings.options]]
value = "vni"
label = "VNI"

[[settings]]
name = "modernTone"
label = "Place tone marks the modern way (hoà, thuý)"
kind = "bool"
default = "true"

[[settings]]
name = "escRestore"
label = "Escape gives back the keys as typed"
kind = "bool"
default = "true"

[[settings]]
name = "englishRestore"
label = "Keep English words as typed"
kind = "bool"
default = "false"

[[settings]]
name = "perApp"
label = "Remember on or off for each app"
kind = "bool"
default = "true"

# The Settings tab is the extension's own page (ui/settings.html) rather
# than Lumi's form, so it can be read in either display language. The
# declarations above still decide what is stored, and Lumi holds every save
# to them. Written last, since a table ends the one before it.
[tabs.settings]
page = "settings.html"

# The About tab is the extension's own page too (ui/about.html), for the same
# reason: what it can reach and its licence, in either display language.
# Lumi keeps its header around the page — the name, the description, the
# version, the switch and Permissions — so what it reaches is still shown in
# Lumi's words.
[tabs.about]
page = "about.html"

# No Changelog tab: the owner's call (2026-10-22). CHANGELOG.md stays in the
# package all the same.
[tabs.changelog]
hidden = true
