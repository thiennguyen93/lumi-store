[package]
name = "lumi-vietnamese-ext"
version = "0.1.2"
edition = "2021"
publish = false
# GPL because the engine carries a word list under the GPL — see
# THIRD-PARTY-NOTICES.md.
license = "GPL-2.0-or-later"

# A reactor component: no `main`, the WIT world's exports are the entry
# points. Build with
#   cargo build --release --target wasm32-wasip2
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The SDK's in-tree copy, beside the sample that carries it — see
# ext/dev.thiennguyen.sample/README.md for why it lives there for now.
lumi-extension-api = { path = "../dev.thiennguyen.sample/api" }
serde_json = "1"
# The typing engine: Gõ Nhanh's core, BSD-3-Clause (THIRD-PARTY-NOTICES.md),
# pinned to the commit this extension was written and measured against.
gonhanh-core = { git = "https://github.com/khaphanspace/gonhanh.org", rev = "968c1f4e559ff84af799522eb24c2899562a8f88" }
