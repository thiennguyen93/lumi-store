<!doctype html>
<!-- The sample's peek panel: `position = "selection"`, `focus = false`. Lumi
     puts it beside the text the person selected — at the point of it the
     manifest's `anchor` or `set_anchor` names — and tells the page where
     (`lumi:placed`); the `peek` command posts what was selected before it
     opens (`lumi:message`), with whether the text can be edited and the
     transforms its buttons offer — or, when the selection is one of the
     person's snippet triggers, what that snippet expands to. Transient: Lumi puts it away at the next
     press, key or scroll anywhere else — and before a button's change is
     written, so the change lands in the app holding the selection. Its
     search field asks for the keyboard on the press that lands in it
     (`POST /__lumi__/keyboard`), and the panel keeps it until the person
     clicks elsewhere. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Selection peek</title>
  <link rel="stylesheet" href="/__lumi__/lumi.css">
  <style>
    html, body { margin: 0; background: transparent; height: 100%; }
    body { font: 12px/1.3 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #f5f5f7; }
    /* As tall as what it shows, never shorter than the panel the manifest
       declares: peek.js asks Lumi for the panel at this height
       (`POST /__lumi__/size`) whenever it changes — a row of buttons that
       wraps, a summary that runs to several lines. */
    main { position: relative; min-height: 104px; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 10px 12px; box-sizing: border-box; }
    .line { display: flex; align-items: center; gap: 8px; min-width: 0; }
    #text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* A summary: read whole, over as many lines as it takes, up to ten. */
    #text.long { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 10; }
    #where { opacity: 0.6; font-variant-numeric: tabular-nums; }
    #actions { display: flex; flex-wrap: wrap; gap: 6px; min-height: 24px; align-items: center; }
    #actions button { font: inherit; color: inherit; background: rgba(255, 255, 255, 0.12); border: 0; border-radius: 6px; padding: 4px 8px; white-space: nowrap; cursor: default; }
    #actions button:hover { background: rgba(255, 255, 255, 0.22); }
    #actions .note { opacity: 0.6; }
    #actions { min-width: 0; }
    /* A snippet's expansion can be a long address: cut, with the whole of it
       in the title. */
    #actions button.snippet { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    #ask { display: flex; }
    #query { flex: 1; min-width: 0; font: inherit; color: inherit; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 6px; padding: 3px 8px; outline: none; }
    #query:focus { border-color: #ff9f0a; }
    /* A notch on the edge facing the text, over the character it stands
       against (`arrow`, points from the left edge). */
    #notch { position: absolute; width: 8px; height: 8px; background: #ff9f0a; border-radius: 2px; transform: translateX(-4px) rotate(45deg); }
    #notch[data-side="above"] { bottom: -4px; }
    #notch[data-side="below"] { top: -4px; }
  </style>
</head>
<body>
  <main>
    <span id="notch" data-side="above" style="left: 50%"></span>
    <div class="line">
      <span id="text">Select some text, then run Peek at the selection.</span>
      <span id="where"></span>
    </div>
    <div id="actions"></div>
    <form id="ask"><input id="query" type="search" placeholder="Search the web for…" autocomplete="off" spellcheck="false"></form>
  </main>
  <script src="peek.js"></script>
</body>
</html>
