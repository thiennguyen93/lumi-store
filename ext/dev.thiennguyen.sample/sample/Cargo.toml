[package]
name = "lumi-sample-ext"
version = "0.16.1"
edition = "2021"
publish = false

# A reactor component: no `main`, the WIT world's exports are the entry
# points. Build with
#   cargo build --release --target wasm32-wasip2
[lib]
crate-type = ["cdylib"]

[dependencies]
lumi-extension-api = { path = "../api" }
serde_json = "1"
percent-encoding = "2.3"
