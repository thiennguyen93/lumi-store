# The sample extension's manifest — the file Lumi's installer checks and the
# review sheet reads to the person before anything is installed. What
# `capabilities` names is what Lumi lets the wasm reach; a call past that list
# is refused by name at runtime, whatever the code inside the component asks
# for.
[extension]
id = "dev.thiennguyen.sample"
name = "Sample"
version = "0.8.0"
min-lumi-version = "1.21.1"
description = "The reference extension: reads the selection, answers through the alert."
author = "Thien Nguyen"
# The longer text Lumi's own About page leads with. `description` is the one
# line the Extensions list has room for.
summary = "The reference extension: one of everything an extension can add to Lumi — a command, a flow node, a setting, a window and an About page — each small enough to read in one sitting."
homepage = "https://lumikeys.app/docs/extensions"
# The extension's own About page, under ui/. Lumi draws it inside the
# Extensions pane in place of the page it would compose from this manifest;
# the Permissions tab beside it stays Lumi's, so a page cannot restate what
# the extension reaches. It gets the settings bridge and no `call`.
about = "about.html"
# And a Settings tab of its own: the same page the settings window shows,
# drawn in place of the form Lumi would compose from [[settings]] below.
# [[settings]] still declares what may be stored — the page saves through
# the bridge, which keeps declared fields only.
settings-page = "index.html"
# How the shortcut sheet's action picker lists the commands below: `auto`
# (the default) puts two or more behind a submenu named after the extension
# and lists a single command directly; `group` and `flat` force either.
menu = "auto"

capabilities = ["accessibility", "applications", "clipboard", "network"]

[[command]]
name = "translate"
label = "Translate selection"
# A command's mark in the action picker and the shortcut list: a Lucide icon
# name from Lumi's icon set, or an .svg file under ui/ (see `grow` below). A
# name Lumi does not ship falls back to the extension's icon.svg.
icon = "globe"

[[command.params]]
name = "target"
label = "Translate into"
kind = "select"
default = "vi"

[[command.params.options]]
value = "vi"
label = "Vietnamese"

[[command.params.options]]
value = "en"
label = "English"

[[command.params.options]]
value = "ja"
label = "Japanese"

# Which Google Translate tab to open. Declared `segmented` — four short
# answers side by side — but each option carries a `note`, because only
# "Text" uses the selection and that is not something the four words say.
# A note turns the choice into radio rows so it is read before choosing;
# Lumi decides that, not this file. Take the notes out and it is the
# segmented control again.
[[command.params]]
name = "op"
label = "Translate"
kind = "segmented"
default = "translate"

[[command.params.options]]
value = "translate"
label = "Text"
note = "Translates what is selected in the front app."

[[command.params.options]]
value = "docs"
label = "Documents"
note = "Opens the page to upload a file. Reads no selection."

[[command.params.options]]
value = "images"
label = "Images"
note = "Opens the page to drop a picture. Reads no selection."

[[command.params.options]]
value = "websites"
label = "Websites"
note = "Opens the page to type an address. Reads no selection."

# Any number of extra languages, each opened in a tab of its own beside the
# first. The value reaches `run_command` as a JSON array of the ticked
# values, in the order listed here — `["en","ja"]` — and `[]` when none is
# ticked. Three options, so Lumi draws a tick beside each; past five it
# would be a list that pops up.
[[command.params]]
name = "also"
label = "Also open in"
kind = "multiselect"
default = []

[[command.params.options]]
value = "vi"
label = "Vietnamese"

[[command.params.options]]
value = "en"
label = "English"

[[command.params.options]]
value = "ja"
label = "Japanese"

# Three params, so the command asks for the sheet's width: the rows under
# `op` do not fit in the column beside Action.
[[command.layout]]
rows = [["op"], ["target", "also"]]
help.also = "A tab each. The language above is skipped here."

# A flow node too, so there is a reference for contributing one: Shout
# upper-cases each item's `text` and tacks the suffix on. Pure compute — it
# shows that a node needs no capability at all to be useful, and it doubles
# as the fixture Lumi's own tests run a flow node through.
[[node]]
name = "shout"
label = "Shout"
summary = "Upper-cases each item's text field."

[[node.params]]
name = "suffix"
label = "Suffix"
kind = "text"
default = "!"

# The pane's own form: one field, read back through `lumi::setting`. The
# action's `target` param outranks it when set — nearest wins — which is
# the three-tier fallback the sample exists to demonstrate.
#
# Kept per profile: someone translating into English at work and into
# Japanese at home sets it once in each, and the code reading it does not
# change at all — `lumi::setting` hands back the live profile's value.
# Leave `scope` out (or write "mac") for one value across every profile.
[[settings]]
name = "defaultTarget"
label = "Default language"
kind = "select"
default = "vi"
scope = "profile"

[[settings.options]]
value = "vi"
label = "Vietnamese"

[[settings.options]]
value = "en"
label = "English"

[[settings.options]]
value = "ja"
label = "Japanese"

# The sample's own window, drawn from the `ui/` files in the package —
# plain HTML and JS here so the shipped source stays the reviewed source;
# a React build's output drops into the same directory the same way. The
# `configure` command opens it, so a shortcut can too.
[[window]]
name = "settings"
title = "Sample settings"
path = "index.html"
width = 440
height = 470
# A settings dialog is a fixed thing: no resize handle, zoom button
# greyed. The switches default on, so only the opt-outs are written.
resizable = false
maximizable = false

[[command]]
name = "configure"
label = "Open sample settings"
icon = "sliders-horizontal"

# The two commands below exist for Lumi's own sandbox tests, which need a
# guest that misbehaves on purpose: one that never returns, and one that eats
# memory until the limiter says no. A store submission carrying either would
# be the review's problem; here they are the fixture.
[[command]]
name = "spin"
label = "Spin forever (limit test)"
icon = "refresh-cw"

[[command]]
name = "grow"
label = "Grow until refused (limit test)"
icon = "icons/grow.svg"
