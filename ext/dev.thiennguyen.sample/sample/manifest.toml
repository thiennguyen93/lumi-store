# The sample extension's manifest — the file Lumi's installer checks and the
# review sheet reads to the person before anything is installed. What
# `capabilities` names is what Lumi lets the wasm reach; a call past that list
# is refused by name at runtime, whatever the code inside the component asks
# for.
[extension]
id = "dev.thiennguyen.sample"
name = "Sample"
version = "0.14.1"
# 1.33.0: the floor is the newest host function the code calls, not the
# world it was built for. WIT 0.3 grew `screen` in 1.30, `snippets` in
# 1.31 and `permissions` and `menu` in 1.33 without a new world version, and the component imports what it
# calls — its test hooks reach both — so an older Lumi could not
# instantiate it. ([tabs] below is the other direction: an older Lumi
# ignores the table and draws its own tabs, so it sets no floor.)
min-lumi-version = "1.33.0"
description = "The reference extension: reads the selection, answers through the alert."
author = "Thien Nguyen"
# The longer text Lumi's own About page leads with. `description` is the one
# line the Extensions list has room for.
summary = "The reference extension: one of everything an extension can add to Lumi — a command, a flow node, a setting, a window and an About page — each small enough to read in one sitting."
homepage = "https://docs.lumikeys.app/extensions"
# The extension's own About page, under ui/. Lumi draws it inside the
# Extensions pane in place of the page it would compose from this manifest;
# the Permissions tab beside it stays Lumi's, so a page cannot restate what
# the extension reaches. It gets the whole bridge, `call` included — the
# call reaches `run_ui` as window `:about`, and only while the page is in front.
about = "about.html"
# And a Settings tab of its own: the same page the settings window shows,
# drawn in place of the form Lumi would compose from [[settings]] below.
# [[settings]] still declares what may be stored — the page saves through
# the bridge, which keeps declared fields only.
settings-page = "index.html"
# How the shortcut sheet's action picker lists the commands below: `auto`
# (the default) puts two or more behind a submenu named after the extension
# and lists a single command directly; `group` and `flat` force either.
menu = "auto"

# The tabs Lumi draws on this extension's page — About, Settings, Shortcuts
# and Changelog — all answer to one table, `[tabs.<name>]`, with the same
# three keys: `label`, `page` (a file under ui/ drawn in its place) and
# `hidden`. Written at the end of this file, since a table ends
# the one before it. (`about` and `settings-page` above are the older
# spelling of `[tabs.about] page` and `[tabs.settings] page`.)

# `screen` for the Permissions part of the settings page: it is the
# capability Screen Recording is for, and without it every `permissions`
# call about Screen Recording is refused by name. The sample takes no
# picture itself; the review sheet still says what the word allows.
# `menu` for its rows in Lumi's menu bar menu (`draw_menu` in src/lib.rs).
capabilities = ["accessibility", "applications", "clipboard", "menu", "network", "screen"]

# Pictures for this extension's page in Lumi's Extension Store: its About
# page and its Settings page. The store publishes them beside the package;
# Lumi's installer ignores the key.
screenshots = ["shots/1-about.png", "shots/2-settings.png"]

[[command]]
name = "translate"
label = "Translate selection"
# A command's mark in the action picker and the shortcut list: a Lucide icon
# name from Lumi's icon set, or an .svg file under ui/ (see `grow` below). A
# name Lumi does not ship falls back to the extension's icon.svg.
icon = "globe"

[[command.params]]
name = "target"
label = "Translate into"
kind = "select"
default = "vi"

[[command.params.options]]
value = "vi"
label = "Vietnamese"

[[command.params.options]]
value = "en"
label = "English"

[[command.params.options]]
value = "ja"
label = "Japanese"

# Which Google Translate tab to open. `segmented` with no `note` on any
# option, so `choiceControl` in extensionChoiceRules.ts draws it as the
# segmented control rather than a radio list — four short answers side by
# side is the point; put a `note` back on any option and Lumi turns the
# whole group into rows again.
[[command.params]]
name = "op"
label = "Translate"
kind = "segmented"
default = "translate"

[[command.params.options]]
value = "translate"
label = "Text"

[[command.params.options]]
value = "docs"
label = "Documents"

[[command.params.options]]
value = "images"
label = "Images"

[[command.params.options]]
value = "websites"
label = "Websites"

# Any number of extra languages, each opened in a tab of its own beside the
# first. The value reaches `run_command` as a JSON array of the ticked
# values, in the order listed here — `["en","ja"]` — and `[]` when none is
# ticked. Three options, so Lumi draws a tick beside each; past five it
# would be a list that pops up.
[[command.params]]
name = "also"
label = "Also open in"
kind = "multiselect"
default = []

[[command.params.options]]
value = "vi"
label = "Vietnamese"

[[command.params.options]]
value = "en"
label = "English"

[[command.params.options]]
value = "ja"
label = "Japanese"

# Three params, so the command asks for the sheet's width: the rows under
# `op` do not fit in the column beside Action.
[[command.layout]]
rows = [["op"], ["target", "also"]]
help.also = "A tab each. The language above is skipped here."

# A flow node too, so there is a reference for contributing one: Shout
# upper-cases each item's `text` and tacks the suffix on. Pure compute — it
# shows that a node needs no capability at all to be useful, and it doubles
# as the fixture Lumi's own tests run a flow node through.
[[node]]
name = "shout"
label = "Shout"
summary = "Upper-cases each item's text field."

[[node.params]]
name = "suffix"
label = "Suffix"
kind = "text"
default = "!"

# The pane's own form: one field, read back through `lumi::setting`. The
# action's `target` param outranks it when set — nearest wins — which is
# the three-tier fallback the sample exists to demonstrate.
#
# Kept per profile: someone translating into English at work and into
# Japanese at home sets it once in each, and the code reading it does not
# change at all — `lumi::setting` hands back the live profile's value.
# Leave `scope` out (or write "mac") for one value across every profile.
[[settings]]
name = "defaultTarget"
label = "Default language"
kind = "select"
default = "vi"
scope = "profile"

[[settings.options]]
value = "vi"
label = "Vietnamese"

[[settings.options]]
value = "en"
label = "English"

[[settings.options]]
value = "ja"
label = "Japanese"

# The sample's own window, drawn from the `ui/` files in the package —
# plain HTML and JS here so the shipped source stays the reviewed source;
# a React build's output drops into the same directory the same way. The
# `configure` command opens it, so a shortcut can too.
[[window]]
name = "settings"
title = "Sample settings"
path = "index.html"
width = 440
height = 470
# A settings dialog is a fixed thing: no resize handle, zoom button
# greyed. The switches default on, so only the opt-outs are written.
resizable = false
maximizable = false

# The Welcome window, opened by the sample's own code the moment it is
# installed — `on_lifecycle` in src/lib.rs. Declared like any other window:
# the declaration is the grant, and the review sheet lists it.
# A window whose page's toolbar is its title bar (`titlebar = "unified"`,
# Lumi 1.30): macOS draws only the traffic lights over its corner. The
# Developer pane's "Open unified window" opens it, to see the band, the
# lights, the drag and the double click on a real window.
[[window]]
name = "unified"
title = "Unified title bar"
path = "unified.html"
width = 720
height = 460
titlebar = "unified"

# The same page in a taller band (`titlebar-height`): the traffic lights
# should stay centred in it, lower down.
[[window]]
name = "unified-tall"
title = "Unified title bar, 72 points"
path = "unified.html"
width = 720
height = 460
titlebar = "unified"
titlebar-height = 72

[[window]]
name = "welcome"
title = "Welcome to Sample"
path = "welcome.html"
width = 420
height = 340
resizable = false
maximizable = false

[[command]]
name = "configure"
label = "Open sample settings"
icon = "sliders-horizontal"

# The two commands below exist for Lumi's own sandbox tests, which need a
# guest that misbehaves on purpose: one that never returns, and one that eats
# memory until the limiter says no. A store submission carrying either would
# be the review's problem; here they are the fixture.
[[command]]
name = "spin"
label = "Spin forever (limit test)"
icon = "refresh-cw"

[[command]]
name = "grow"
label = "Grow until refused (limit test)"
icon = "icons/grow.svg"

# The sample's own installer. On a fresh install Lumi first shows its own
# review of the package — what it reaches and who signed it, which is never
# this page's to say — and its button reads Continue… instead of Install.
# This page then opens in a window of its own, asks for the default language
# above, and nothing is installed until its Install is pressed; its Cancel,
# or closing the window, abandons the install and writes nothing. What it
# sets lands in settings.json with the package, through the same
# declared-fields filter as any other save. An update never opens it — the
# person's settings are kept — and a Lumi that predates [install] ignores
# the table and installs with every setting at its default.
[install]
page = "install.html"
title = "Set up Sample"
width = 420
height = 380

# The Changelog tab draws CHANGELOG.md, which rides in the package beside
# this file. Renamed here to show the table; `hidden = true` would drop the
# tab, and `page = "…"` would draw a page of this extension's own in it.
# Lumi before 1.32.0 ignores the table and keeps its own name.
[tabs.changelog]
label = "What's new"
