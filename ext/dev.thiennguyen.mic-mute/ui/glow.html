<!doctype html>
<!-- The glow round every display while ⌥⌘M is held, when "While talking"
     says Screen Glow (`[[window]] glow`, `kind = "overlay"`). Lumi lays the
     page out at the display's size and lets every press through it; the
     page draws only the rim, in the orange macOS gives a microphone in use,
     and holds it still under Reduce Motion. Opened on the key going down,
     closed on its coming up. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mic Mute</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    .rim {
      --live: rgb(255 149 0 / 0.9);
      --soft: rgb(255 149 0 / 0.5);
      position: fixed;
      inset: 0;
      box-shadow: inset 0 0 0 3px var(--live), inset 0 0 28px var(--soft);
      animation: breathe 2.4s ease-in-out infinite;
    }
    @media (prefers-color-scheme: dark) {
      .rim { --live: rgb(255 159 10 / 0.95); --soft: rgb(255 159 10 / 0.55); }
    }
    @keyframes breathe {
      50% { box-shadow: inset 0 0 0 3px var(--live), inset 0 0 14px var(--soft); }
    }
    @media (prefers-reduced-motion: reduce) {
      .rim { animation: none; }
    }
  </style>
</head>
<body>
  <div class="rim"></div>
</body>
</html>
