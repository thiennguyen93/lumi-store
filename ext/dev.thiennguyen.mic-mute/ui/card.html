<!doctype html>
<!-- The card at the top right while ⌥⌘M is held (`[[window]] card`, the
     "Card" choice of the "While talking" setting). It is told what to show by
     `lumi::post` — "talking" ("talking-on", with "Let go to mute", for a talk
     begun with the microphones on), "muted" or "unmuted" after a tap, "ended" when
     Lumi ended the talk on its own — and never takes a press: every opening says it
     takes nothing, so the pointer reaches whatever is under it. card.js
     draws, and asks the component to put it away once a passing state has
     been read. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mic Mute</title>
  <link rel="stylesheet" href="/__lumi__/lumi.css">
  <link rel="stylesheet" href="card.css">
</head>
<body>
  <main class="card" data-state="talking" role="status" aria-live="polite">
    <span class="disc" aria-hidden="true">
      <svg class="on" viewBox="0 0 24 24"><path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9" y="2" width="6" height="13" rx="3"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M12 19v3"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M16.95 16.95A7 7 0 0 1 5 12v-2"/><path d="M18.89 13.23A7 7 0 0 0 19 12v-2"/><path d="m2 2 20 20"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/></svg>
    </span>
    <span class="words"><b id="title">Talking</b><small id="sub" hidden></small></span>
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
  </main>
  <script src="card.js"></script>
</body>
</html>
