# Clipboard Manager's manifest.
#
# Listed in extensions.toml, and held back by `min-lumi-version` alone: the
# `clipboard-history` and `input` capabilities, `events` and the panel `kind`
# all arrive with lumi:ext 0.3 in Lumi 1.25.0, and an older Lumi shows this
# as needing an update rather than installing it. 1.26.0 since Save image
# as…: `storage.blob-save` is a new import, and a component that imports it
# does not load on a Lumi without it at all. 1.29.0 since the panel's pin, for
# the same reason: `ui.set-pinned`. 1.31.0 since snippets — and Show and
# Toggle ask `ui.window-state`, which arrives there too. 1.33.0 for the
# menu bar rows (`menu`), and 1.34.0 since they wear icons:
# `menu.set-rows`.
[extension]
id = "dev.thiennguyen.clipboard"
name = "Clipboard Manager"
version = "0.79.0"
description = "Keep what you copy — text, links, images and files — and paste it back from a panel."
author = "Thien Nguyen"
summary = "Remembers what you copy on this Mac and brings it back with one shortcut: search, pick, and it is pasted into the app you were typing in. Text, rich text, links, colours, files and images, with pins for what you keep reaching for. Anything a password manager marks as secret is never recorded — Lumi drops it before this extension hears of it — and the history is stored encrypted with a key Lumi keeps in your Keychain. Nothing leaves your Mac: the extension has no network access."
homepage = "https://lumikeys.app/extensions/dev.thiennguyen.clipboard/"
min-lumi-version = "1.37.0"
# `clipboard-history`: hears each copy (the review sheet says so).
# `clipboard`: puts a chosen item back on the pasteboard.
# `input` + `accessibility`: pastes it into the app in front — the same
# two a Lumi flow needs to type by pasting.
# `snippets`: a copy that is one of your snippet triggers shows what it
# expands to — Lumi matches and expands it, as typing would. 1.31.0 for it.
capabilities = ["clipboard", "clipboard-history", "input", "accessibility", "snippets", "menu"]
# `clipboard-ocr`: the text Lumi reads in a copied image, a moment after the
# copy, so a screenshot can be found by what it says. Switched by the `ocr`
# setting below.
# `window-closed`: the panel put away (Lumi 1.37), which "Cover again after
# panel closes" and "Lock again after panel closes" count from.
events = ["clipboard", "clipboard-ocr", "window-closed"]
# Pictures for this extension's page in Lumi's Extension Store. The store
# publishes them beside the package; Lumi's installer ignores the key.
screenshots = ["shots/1-history.png", "shots/2-welcome.png", "shots/3-settings.png"]
# The Settings tab is drawn by web/settings.html rather than from the
# [[settings]] below — which still decide what it can save.
settings-page = "settings.html"

# The panel's three commands. Show only ever brings it up — pressed while
# it is up, the panel takes the keyboard back and its selection blinks; only
# Escape, Hide or Toggle put it away. `open`, not `show`: the name the
# shortcut below and the keys people gave it already point at.
[[command]]
name = "open"
label = "Show clipboard history"
icon = "clipboard-list"

[[command]]
name = "hide"
label = "Hide clipboard history"
icon = "eye-off"

# Up: put away, pinned or not. Not up: shown, as Show does.
[[command]]
name = "toggle"
label = "Toggle clipboard history"
icon = "toggle-right"

# Privacy mode on or off without opening the panel — which would show the
# newest copy — for a key of the person's own in Lumi's Settings, like Hide
# and Toggle. The menu bar row does the same.
[[command]]
name = "privacy"
label = "Toggle privacy mode"
icon = "shield"

# Show's key — Hide, Toggle and Privacy come with none, for the person to
# give them in Lumi's Settings. Maccy's key, as the extension's own: Lumi arms it at
# install when nothing holds it, in every profile, and it goes with the
# extension. When something
# does hold it Lumi arms nothing and says who — the Welcome window's second
# step reads that and asks. Replaces the `suggested-key` this command had,
# which was a row proposed to the person rather than a key of its own.
[[shortcut]]
command = "open"
key = "cmd+shift+c"

# The eight-step tour `on_lifecycle` opens when the extension is installed
# or updated: what it keeps, how it is kept private, its shortcut (armed,
# or not — and then what to do), the keys inside the panel, the preview,
# privacy mode, Touch ID, and dragging out. An ordinary declared window: the
# declaration is the grant, and the review sheet lists it.
[[window]]
name = "welcome"
title = "Welcome to Clipboard Manager"
path = "welcome.html"
width = 560
height = 460
resizable = false
maximizable = false

# The panel: borderless, floats over whatever is in front without taking
# it out of front, and takes the keyboard so the search field can be typed
# in (Vietnamese input methods included). Closes as soon as it loses the
# keyboard.
[[window]]
name = "history"
title = "Clipboard Manager"
path = "panel.html"
kind = "panel"
position = "cursor"
# macOS's popover glass behind the page — the blur Spotlight uses, light or
# dark with the system. The page leaves its background clear for it.
material = "popover"
width = 620
height = 430

# The first tab of the extension's page in Lumi: live counts from the
# history, asked of `run-ui` as the `:page:dashboard` window and pushed to
# it with `ui.post` after each copy, pin or delete.
[[page]]
name = "dashboard"
label = "Dashboard"
path = "dashboard.html"

# How long an unpinned row is kept after it was last copied. Pins stay.
[[settings]]
name = "keep"
label = "Keep history for"
kind = "select"
default = "3mo"

[[settings.options]]
value = "5m"
label = "5 minutes"

[[settings.options]]
value = "1h"
label = "1 hour"

[[settings.options]]
value = "1d"
label = "1 day"

[[settings.options]]
value = "1w"
label = "1 week"

[[settings.options]]
value = "1mo"
label = "1 month"

[[settings.options]]
value = "3mo"
label = "3 months"

[[settings]]
name = "pasteOnSelect"
label = "Paste the item you pick"
kind = "bool"
default = "true"

# A drag out of the panel leaves it up by default, so several items can be
# dragged out one after another.
[[settings]]
name = "closeAfterDrag"
label = "Close the panel after dragging an item out"
kind = "bool"
default = "false"

# Lumi reads for this extension only while this is on: a second or two of
# CPU per image copied.
[[settings]]
name = "ocr"
label = "Search text in images"
kind = "bool"
default = "true"

# Privacy mode itself is a switch the extension keeps (menu bar, command,
# Settings tab), not a setting. This is how long what the panel showed while
# it is on stays shown after the panel closes — an opening within it shows
# it again — counted from Lumi's `window-closed`. "Immediately" keeps the
# name `never` from when this meant a while with nothing done.
[[settings]]
name = "privacyIdle"
label = "Cover again after panel closes"
kind = "select"
default = "never"

[[settings.options]]
value = "never"
label = "Immediately"

[[settings.options]]
value = "30s"
label = "After 30 seconds"

[[settings.options]]
value = "1m"
label = "After 1 minute"

[[settings.options]]
value = "5m"
label = "After 5 minutes"

# The panel's own Pin key, while the panel is up — not a global shortcut.
# Spelled "cmd+p", "ctrl+shift+1"; the Settings tab records it. ⌘P because
# no row is ever given ⌘P (`history::PIN_LETTERS`), and ⌘⇧P pins the panel.
[[settings]]
name = "pinKey"
label = "Pin shortcut"
kind = "text"
default = "cmd+p"

# macOS's "Is it you?" dialog — Touch ID, a Watch or the login password —
# before the first preview shown in an opening (`POST /__lumi__/authenticate`,
# Lumi 1.36). A page route, not an import: an older Lumi still loads this, and
# the Settings tab offers the switch only where the dialog can be shown.
[[settings]]
name = "privacyConfirm"
label = "Confirm it's you before showing"
kind = "bool"
default = "false"

# The whole history behind that dialog: the panel opens locked — no list, no
# preview, no paste — until the owner confirms.
[[settings]]
name = "lockHistory"
label = "Lock history"
kind = "bool"
default = "false"

# How long an unlocked history stays unlocked after the panel closes —
# counted from Lumi's `window-closed`, kept as `lock.until` in storage — so
# openings within it open unlocked. While the panel is up it stays unlocked.
[[settings]]
name = "lockAfter"
label = "Lock again after panel closes"
kind = "select"
default = "close"

[[settings.options]]
value = "close"
label = "Immediately"

[[settings.options]]
value = "1m"
label = "After 1 minute"

[[settings.options]]
value = "5m"
label = "After 5 minutes"

[[settings.options]]
value = "15m"
label = "After 15 minutes"

# Privacy mode's show or hide of the selected item, while the panel is up —
# the panel's own key, as Pin's is, recorded on the Settings tab and checked
# by the page against Pin's and the panel's other keys. ⌘⇧H beside ⌘⇧P.
[[settings]]
name = "revealKey"
label = "Show or hide shortcut"
kind = "text"
default = "cmd+shift+h"

# The same for every item at once, until the panel covers them again: so
# the person need not show items one by one. ⌥ added, macOS's "all" key —
# not ⌥⌘H, which macOS gives Hide Others.
[[settings]]
name = "revealAllKey"
label = "Show or hide all shortcut"
kind = "text"
default = "alt+shift+cmd+h"

# How the panel's search reads a query — Maccy's four modes.
[[settings]]
name = "search"
label = "Search"
kind = "segmented"
default = "mixed"

[[settings.options]]
value = "exact"
label = "Exact"

[[settings.options]]
value = "fuzzy"
label = "Fuzzy"

[[settings.options]]
value = "regexp"
label = "Regex"

[[settings.options]]
value = "mixed"
label = "Mixed"

[[settings]]
name = "sort"
label = "Order"
kind = "segmented"
default = "last"

[[settings.options]]
value = "last"
label = "Last copied"

[[settings.options]]
value = "first"
label = "First copied"

[[settings.options]]
value = "used"
label = "Most used"

# The panel's glass — macOS's own materials. The manifest's `material`
# above is only the default; the panel is opened on this one.
[[settings]]
name = "appearance"
label = "Appearance"
kind = "segmented"
default = "popover"

[[settings.options]]
value = "popover"
label = "Glass"

[[settings.options]]
value = "hud"
label = "Dark glass"

[[settings.options]]
value = "sidebar"
label = "Frosted"

# Light or dark for the panel; "system" follows macOS. Dark glass is dark
# whatever this says.
[[settings]]
name = "theme"
label = "Theme"
kind = "segmented"
default = "system"

[[settings.options]]
value = "dark"
label = "Dark"

[[settings.options]]
value = "light"
label = "Light"

[[settings.options]]
value = "system"
label = "System"

# One bundle id per line, e.g. com.apple.keychainaccess. Copies made while
# one of these is in front are not kept.
[[settings]]
name = "ignoreApps"
label = "Never keep copies from"
kind = "textarea"
default = ""

# One regular expression per line; a copy whose text matches is not kept.
[[settings]]
name = "ignorePatterns"
label = "Never keep text matching"
kind = "textarea"
default = ""

# Whether a copy that is one of your snippet triggers shows what it
# expands to, in the preview's "Expands to".
[[settings]]
name = "matchSnippets"
label = "Match snippets"
kind = "bool"
default = "true"

# Whose snippets it looks in, while that is on: the live profile's, every
# profile's, or the ones ticked under Selected Profiles (`snippetProfiles`).
[[settings]]
name = "snippetsIn"
label = "Look in"
kind = "segmented"
default = "current"

[[settings.options]]
value = "current"
label = "Current Profile"

[[settings.options]]
value = "all"
label = "All Profiles"

[[settings.options]]
value = "selected"
label = "Selected Profiles"

# The profiles Selected Profiles looks in: their ids, joined by commas.
# Ticked in the Look in menu on the Settings tab, found by name.
[[settings]]
name = "snippetProfiles"
label = "Profiles to match"
kind = "text"
default = ""
