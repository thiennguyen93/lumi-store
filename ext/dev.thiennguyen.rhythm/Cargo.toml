[package]
name = "lumi-rhythm-ext"
version = "0.2.0"
edition = "2021"
publish = false

# A reactor component: no `main`, the WIT world's exports are the entry
# points. Build with
#   cargo build --release --target wasm32-wasip2
[lib]
crate-type = ["cdylib"]

[dependencies]
# The SDK's in-tree copy, beside the sample that carries it — see
# ext/dev.thiennguyen.sample/README.md for why it lives there for now.
lumi-extension-api = { path = "../dev.thiennguyen.sample/api" }
# The window's requests and the free music search's answers are JSON.
serde_json = "1"
